enum HunterStingType {
	NoSting = 0;
	ScorpidSting = 1;
	SerpentSting = 2;
}

message HunterOptions {
	enum QuiverBonus {
		QuiverNone = 0;
		Speed10 = 1;
		Speed11 = 2;
		Speed12 = 3;
		Speed13 = 4;
		Speed14 = 5;
		Speed15 = 6;
	}
	QuiverBonus quiver_bonus = 1;

	enum Ammo {
		AmmoNone = 0;
		TimelessArrow = 1;
		MysteriousArrow = 2;
		AdamantiteStinger = 3;
		WardensArrow = 4;
		HalaaniRazorshaft = 5;
		BlackflightArrow = 6;
