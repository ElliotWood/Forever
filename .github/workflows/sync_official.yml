name: Sync official branch

# Keeps the `official` branch in step with wowsims/forever master. It only ever writes `official` and
# `sync/upstream`: master and the live site are never touched, and nothing here deploys.
#
#   upstream master -> merged into sync/upstream -> upstream's own tests -> fast-forward `official`
#
# On a merge conflict or a test failure, `official` stays put and a pull request from sync/upstream,
# labelled upstream-sync, says why. A human fixes it on sync/upstream; the next green run (or merging the
# pull request) moves `official` on.
#
# sync/upstream is only ever added to, never rewritten: each run merges `official` into it first, so it
# picks up whatever landed there, then merges upstream.
#
# This file lives on master only because scheduled workflows run from the default branch.
#
# Known gap: the GITHUB_TOKEN may not push commits that change .github/workflows. When upstream edits a
# workflow the push is refused; the run then opens an upstream-sync issue with the two commands to run by hand.
on:
    schedule:
        - cron: '41 */6 * * *'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write
    issues: write

concurrency:
    group: sync-official
    cancel-in-progress: false

jobs:
    merge:
        runs-on: ubuntu-latest
        outputs:
            status: ${{ steps.merge.outputs.status }}
            sha: ${{ steps.merge.outputs.sha }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: official
                  fetch-depth: 0

            - name: Merge upstream into sync/upstream
              id: merge
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch --no-tags https://github.com/wowsims/forever.git master
                  upstream=$(git rev-parse FETCH_HEAD)
                  if git merge-base --is-ancestor "$upstream" origin/official; then
                      echo "official already has wowsims/forever $upstream"
                      echo "status=uptodate" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  if git ls-remote --exit-code origin sync/upstream > /dev/null; then
                      git fetch origin sync/upstream
                      git checkout -B sync/upstream FETCH_HEAD
                      git merge --no-edit origin/official
                  else
                      git checkout -B sync/upstream origin/official
                  fi

                  status=merged
                  if ! git merge --no-edit -m "Merge wowsims/forever master ($upstream)" "$upstream"; then
                      # Commit the conflict markers so the pull request shows exactly what needs resolving.
                      status=conflict
                      git add -A
                      git commit --no-edit -m "Merge wowsims/forever master ($upstream) - CONFLICTS, resolve before merging"
                  fi

                  if ! git push origin sync/upstream; then
                      title="upstream-sync: push refused for wowsims/forever $upstream"
                      body="The sync could not push sync/upstream, most likely because upstream changed a workflow file and the GITHUB_TOKEN may not push those. Run locally: \`git fetch https://github.com/wowsims/forever.git master && git checkout sync/upstream && git merge FETCH_HEAD && git push origin sync/upstream\`, then re-run the Sync official branch workflow. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                      gh label create upstream-sync --color d93f0b --description "wowsims/forever sync needs a human" 2> /dev/null || true
                      if [ -z "$(gh issue list --label upstream-sync --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
                          gh issue create --title "$title" --label upstream-sync --body "$body"
                      fi
                      exit 1
                  fi
                  echo "status=$status" >> "$GITHUB_OUTPUT"
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    test:
        needs: merge
        if: needs.merge.outputs.status == 'merged'
        uses: ElliotWood/Forever/.github/workflows/run_tests.yml@official
        with:
            ref: ${{ needs.merge.outputs.sha }}

    promote:
        needs: [merge, test]
        if: always() && needs.merge.result == 'success' && needs.merge.outputs.status != 'uptodate'
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPO: ${{ github.repository }}
            SHA: ${{ needs.merge.outputs.sha }}
            STATUS: ${{ needs.merge.outputs.status }}
            TESTS: ${{ needs.test.result }}
            RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            - name: Fast-forward official, or open a pull request
              run: |
                  if [ "$STATUS" = merged ] && [ "$TESTS" = success ]; then
                      # force=false: refuses anything but a fast-forward. An open upstream-sync pull request
                      # closes itself as merged once official reaches its head.
                      gh api -X PATCH "repos/$GH_REPO/git/refs/heads/official" -f sha="$SHA" -F force=false
                      exit 0
                  fi

                  if [ "$STATUS" = conflict ]; then why="merge conflicts with wowsims/forever"; else why="upstream's tests failed ($TESTS)"; fi
                  gh label create upstream-sync --color d93f0b --description "wowsims/forever sync needs a human" 2> /dev/null || true
                  pr=$(gh pr list --head sync/upstream --base official --state open --json number --jq '.[0].number')
                  if [ -z "$pr" ]; then
                      gh pr create --head sync/upstream --base official --label upstream-sync \
                          --title "Sync wowsims/forever into official" \
                          --body "Not merged automatically: $why. Fix it on sync/upstream, then merge this. Run: $RUN"
                  else
                      gh pr comment "$pr" --body "Still blocked at $SHA: $why. Run: $RUN"
                  fi
